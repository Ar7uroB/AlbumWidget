plugins {
    id 'com.android.application'
}

android {
    namespace 'com.albumwidget.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.albumwidget.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la llave de debug para poder instalarlo directamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
